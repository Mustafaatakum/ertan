<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyahat Kasa Takip Deneme No:4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-900">

<div class="container mx-auto p-4 max-w-5xl">
    <header class="bg-indigo-700 text-white p-8 rounded-t-3xl shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 p-4 opacity-10">
            <svg width="150" height="150" fill="currentColor" viewBox="0 0 24 24"><path d="M21 16.5c0 .38-.21.71-.53.88l-7.97 4.44c-.31.17-.69.17-1 0l-7.97-4.44c-.32-.17-.53-.5-.53-.88v-9c0-.38.21-.71.53-.88l7.97-4.44c.31-.17.69-.17 1 0l7.97 4.44c.32.17.53.5.53.88v9z"/></svg>
        </div>
        <div class="relative z-10">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h1 class="text-3xl font-black tracking-tighter uppercase mb-1">Seyahat Kasa Takip</h1>
                    <div class="flex items-center gap-2">
                        <span class="bg-yellow-400 text-indigo-900 text-[10px] font-bold px-2 py-0.5 rounded">DENEME NO: 4</span>
                        <span class="text-indigo-100 text-xs font-medium">Mustafa Şahin IT Systems</span>
                    </div>
                </div>
                <div id="current-date" class="glass px-4 py-2 rounded-2xl text-sm font-bold"></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass p-5 rounded-2xl">
                    <p class="text-[10px] uppercase font-bold text-indigo-200 mb-1">Toplam Gelir</p>
                    <p id="stat-gelir" class="text-3xl font-black text-green-300">0.00 ₺</p>
                </div>
                <div class="glass p-5 rounded-2xl">
                    <p class="text-[10px] uppercase font-bold text-indigo-200 mb-1">Toplam Gider</p>
                    <p id="stat-gider" class="text-3xl font-black text-red-300">0.00 ₺</p>
                </div>
                <div id="stat-kar-box" class="glass p-5 rounded-2xl border-l-4 border-white">
                    <p class="text-[10px] uppercase font-bold text-indigo-200 mb-1">Net Durum</p>
                    <p id="stat-kar" class="text-3xl font-black">0.00 ₺</p>
                </div>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b flex shadow-sm sticky top-0 z-50 overflow-x-auto">
        <button onclick="showTab('kasa')" class="flex-1 py-5 text-xs font-black border-b-4 border-transparent hover:bg-slate-50 focus:border-indigo-600 transition-all uppercase tracking-widest">Kasa Listesi</button>
        <button onclick="showTab('ekle')" class="flex-1 py-5 text-xs font-black border-b-4 border-transparent hover:bg-slate-50 focus:border-indigo-600 transition-all uppercase tracking-widest">Yeni İşlem</button>
        <button onclick="showTab('ayarlar')" class="flex-1 py-5 text-xs font-black border-b-4 border-transparent hover:bg-slate-50 focus:border-indigo-600 transition-all uppercase tracking-widest">Ayarlar</button>
        <button onclick="showTab('veri')" class="flex-1 py-5 text-xs font-black border-b-4 border-transparent hover:bg-slate-50 focus:border-indigo-600 transition-all uppercase tracking-widest">Veri Yönetimi</button>
    </nav>

    <div id="kasa" class="tab-content active bg-white p-6 shadow-xl rounded-b-3xl">
        <div class="flex flex-wrap gap-4 mb-8 bg-slate-50 p-5 rounded-2xl border border-slate-100 items-end">
            <div class="flex-1 min-w-[150px]">
                <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block ml-1">Tarih Aralığı (Başlangıç)</label>
                <input type="date" id="filter-start" class="w-full border-2 border-white shadow-sm p-3 rounded-xl text-sm outline-none focus:border-indigo-400 transition-all">
            </div>
            <div class="flex-1 min-w-[150px]">
                <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block ml-1">Tarih Aralığı (Bitiş)</label>
                <input type="date" id="filter-end" class="w-full border-2 border-white shadow-sm p-3 rounded-xl text-sm outline-none focus:border-indigo-400 transition-all">
            </div>
            <div class="flex gap-2">
                <button onclick="filterTable()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all">Süz</button>
                <button onclick="downloadPDF()" class="bg-slate-800 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-lg shadow-slate-200 hover:bg-black active:scale-95 transition-all">PDF Al</button>
            </div>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left border-separate border-spacing-y-2">
                <thead>
                    <tr class="text-[11px] text-slate-400 uppercase tracking-[0.2em]">
                        <th class="px-4 py-2">Tür</th>
                        <th class="px-4 py-2">Açıklama / Kalem</th>
                        <th class="px-4 py-2 text-right">Tutar</th>
                        <th class="px-4 py-2 text-center">Tarih</th>
                        <th class="px-4 py-2 text-center">İşlem</th>
                    </tr>
                </thead>
                <tbody id="kasa-tbody"></tbody>
            </table>
        </div>
    </div>

    <div id="ekle" class="tab-content bg-white p-10 shadow-xl rounded-b-3xl">
        <div class="max-w-xl mx-auto">
            <div class="flex p-1.5 bg-slate-100 rounded-2xl border mb-8">
                <label class="flex-1 text-center py-3 rounded-xl cursor-pointer font-black text-xs transition-all has-[:checked]:bg-green-500 has-[:checked]:text-white uppercase tracking-widest">
                    <input type="radio" name="type" value="Gelir" class="hidden" checked onclick="updateSelectionList()"> Gelir (+)
                </label>
                <label class="flex-1 text-center py-3 rounded-xl cursor-pointer font-black text-xs transition-all has-[:checked]:bg-red-500 has-[:checked]:text-white uppercase tracking-widest">
                    <input type="radio" name="type" value="Gider" class="hidden" onclick="updateSelectionList()"> Gider (-)
                </label>
            </div>
            
            <div class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase ml-1">İşlem Kalemi</label>
                        <select id="item-select" onchange="handleItemSelect()" class="w-full border-2 border-slate-50 bg-slate-50 p-4 rounded-2xl font-bold text-slate-700 outline-none focus:bg-white focus:border-indigo-400 transition-all shadow-inner"></select>
                        <input type="text" id="manual-name" placeholder="Kalem Adı Yazın..." class="w-full mt-3 border-2 border-orange-100 bg-orange-50 p-4 rounded-2xl hidden outline-none focus:bg-white focus:border-orange-400">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase ml-1">Tutar (TL)</label>
                        <input type="number" id="form-price" class="w-full border-2 border-slate-50 bg-slate-50 p-4 rounded-2xl font-black text-xl outline-none focus:bg-white focus:border-indigo-400 transition-all shadow-inner" step="0.01">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase ml-1">İşlem Tarihi</label>
                        <input type="date" id="form-date" class="w-full border-2 border-slate-50 bg-slate-50 p-4 rounded-2xl font-bold outline-none focus:bg-white focus:border-indigo-400 transition-all shadow-inner">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase ml-1">Not / Detay</label>
                    <textarea id="form-desc" class="w-full border-2 border-slate-50 bg-slate-50 p-4 rounded-2xl text-sm outline-none focus:bg-white focus:border-indigo-400 transition-all shadow-inner" rows="3"></textarea>
                </div>
                <button onclick="saveRecord()" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-black text-lg hover:bg-indigo-700 active:scale-[0.98] transition-all uppercase shadow-xl shadow-indigo-100">Kasaya İşle</button>
            </div>
        </div>
    </div>

    <div id="ayarlar" class="tab-content bg-white p-10 shadow-xl rounded-b-3xl">
        <div class="grid md:grid-cols-2 gap-10">
            <div class="bg-slate-50 p-8 rounded-3xl border border-slate-100 space-y-4">
                <h3 class="text-slate-900 font-black uppercase text-sm mb-4">Hızlı Kalem Ekle</h3>
                <input type="text" id="set-name" placeholder="Örn: Akaryakıt" class="w-full p-4 rounded-xl border-2 border-white shadow-sm outline-none">
                <select id="set-type" class="w-full p-4 rounded-xl border-2 border-white shadow-sm font-bold uppercase text-xs"><option value="Gelir">Gelir Tipi</option><option value="Gider">Gider Tipi</option></select>
                <div class="flex items-center gap-3 p-2 bg-white rounded-xl border border-slate-100 shadow-sm">
                    <input type="checkbox" id="set-fixed" class="w-6 h-6 rounded-lg accent-indigo-600">
                    <label for="set-fixed" class="text-xs font-bold text-slate-600">Sabit Fiyat Kullan</label>
                </div>
                <input type="number" id="set-price" placeholder="Fiyat (₺)" class="w-full p-4 rounded-xl border-2 border-white shadow-sm outline-none">
                <button onclick="addSettingItem()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-black transition-all">Listeye Kaydet</button>
            </div>
            <div id="settings-list" class="space-y-3"></div>
        </div>
    </div>

    <div id="veri" class="tab-content bg-white p-12 shadow-xl rounded-b-3xl text-center">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-3xl mx-auto font-black text-[11px] uppercase tracking-tighter">
            <button onclick="exportData()" class="p-8 rounded-3xl bg-blue-50 text-blue-600 border border-blue-100 hover:bg-blue-600 hover:text-white transition-all shadow-sm">Dosyaya Yedekle</button>
            <label class="p-8 rounded-3xl bg-emerald-50 text-emerald-600 border border-emerald-100 cursor-pointer hover:bg-emerald-600 hover:text-white transition-all shadow-sm">Yedekten Geri Yükle<input type="file" class="hidden" onchange="importData(event)"></label>
            <button onclick="clearAllData()" class="p-8 rounded-3xl bg-rose-50 text-rose-600 border border-rose-100 hover:bg-rose-600 hover:text-white transition-all shadow-sm">Kasayı Sıfırla</button>
        </div>
        <p class="mt-12 text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em]">Mustafa Şahin • IT Teacher • Samsun 2026</p>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('records')) || [];
    let settings = JSON.parse(localStorage.getItem('settings')) || [{name:"Yolcu Ücreti",type:"Gelir",fixed:true,price:1000},{name:"Şoför Ücreti",type:"Gider",fixed:false,price:0},{name:"Yemek Ücreti",type:"Gider",fixed:false,price:0},{name:"Akaryakıt",type:"Gider",fixed:false,price:0}];
    
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'});

    function showTab(id){
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id==='ekle')updateSelectionList();
        if(id==='kasa')renderTable();
        if(id==='ayarlar')renderSettings();
    }

    function renderSettings(){
        const c=document.getElementById('settings-list');
        c.innerHTML='';
        settings.forEach((s,i)=>{
            c.innerHTML+=<div class="flex justify-between items-center p-4 bg-white rounded-2xl border border-slate-100 shadow-sm border-l-8 "><div class="flex flex-col"><span class="text-xs font-black uppercase text-slate-800"></span><span class="text-[10px] text-slate-400"></span></div><button onclick="deleteSetting()" class="bg-slate-100 p-2 rounded-lg text-slate-400 hover:text-red-500 transition-all">🗑️</button></div>;
        });
        localStorage.setItem('settings',JSON.stringify(settings));
    }

    function addSettingItem(){
        const n=document.getElementById('set-name').value;
        if(!n) return;
        settings.push({name:n,type:document.getElementById('set-type').value,fixed:document.getElementById('set-fixed').checked,price:parseFloat(document.getElementById('set-price').value)||0});
        renderSettings();
        document.getElementById('set-name').value='';
    }

    function deleteSetting(i){ if(confirm('Silinsin mi?')) { settings.splice(i,1); renderSettings(); } }

    function updateSelectionList(){
        const t=document.querySelector('input[name="type"]:checked').value;
        const s=document.getElementById('item-select');
        s.innerHTML='';
        settings.filter(x=>x.type===t).forEach(x=>{
            const o=document.createElement('option');o.value=x.name;o.textContent=x.name;
            if(x.name==="Yolcu Ücreti")o.selected=true;
            s.appendChild(o);
        });
        const o=document.createElement('option');o.value="CUSTOM";o.textContent="🔍 Listede Yok (Elle Yaz)";
        s.appendChild(o);
        handleItemSelect();
        document.getElementById('form-date').valueAsDate=new Date();
    }

    function handleItemSelect(){
        const v=document.getElementById('item-select').value;
        const p=document.getElementById('form-price');
        const m=document.getElementById('manual-name');
        const s=settings.find(x=>x.name===v);
        if(s){p.value=s.fixed?s.price:0;m.value=s.name;m.classList.add('hidden');}
        else{p.value=0;m.value="";m.classList.remove('hidden');m.focus();}
    }

    function saveRecord(){
        const r={id:Date.now(),type:document.querySelector('input[name="type"]:checked').value,name:document.getElementById('manual-name').value,price:parseFloat(document.getElementById('form-price').value)||0,date:document.getElementById('form-date').value,desc:document.getElementById('form-desc').value};
        if(!r.name||!r.date) { alert('Kalem adı ve tarih zorunludur!'); return; }
        records.push(r);
        localStorage.setItem('records',JSON.stringify(records));
        showTab('kasa');
    }

    function renderTable(d=records){
        const b=document.getElementById('kasa-tbody');
        b.innerHTML='';
        let gel=0,gid=0;
        d.sort((a,x)=>new Date(x.date)-new Date(a.date)).forEach(r=>{
            if(r.type==='Gelir')gel+=r.price;else gid+=r.price;
            b.innerHTML+=<tr class="bg-white border border-slate-50 shadow-sm transition-all hover:bg-indigo-50/30 group">
                <td class="px-4 py-5"><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase "></span></td>
                <td class="px-4 py-5"><div class="font-black text-slate-800 text-sm uppercase"></div><div class="text-[10px] text-slate-400 font-medium"></div></td>
                <td class="px-4 py-5 text-right font-black text-slate-900"> ₺</td>
                <td class="px-4 py-5 text-center text-[11px] font-bold text-slate-500"></td>
                <td class="px-4 py-5 text-center"><button onclick="delRec()" class="opacity-20 group-hover:opacity-100 transition-all text-sm">❌</button></td>
            </tr>;
        });
        updateStats(gel,gid);
    }

    function updateStats(ge,gi){
        document.getElementById('stat-gelir').textContent=ge.toLocaleString('tr-TR', { minimumFractionDigits: 2 })+' ₺';
        document.getElementById('stat-gider').textContent=gi.toLocaleString('tr-TR', { minimumFractionDigits: 2 })+' ₺';
        const n=ge-gi;
        const el = document.getElementById('stat-kar');
        el.textContent=n.toLocaleString('tr-TR', { minimumFractionDigits: 2 })+' ₺';
        el.className = n >= 0 ? "text-3xl font-black text-green-300" : "text-3xl font-black text-orange-400";
    }

    function filterTable(){
        const s=document.getElementById('filter-start').value,e=document.getElementById('filter-end').value;
        if(s&&e) renderTable(records.filter(r=>r.date>=s&&r.date<=e));
        else alert('Lütfen tarih seçin!');
    }

    function delRec(i){if(confirm('Bu işlem geri alınamaz. Silinsin mi?')){records=records.filter(x=>x.id!==i);localStorage.setItem('records',JSON.stringify(records));renderTable();}}

    function downloadPDF(){
        const{jsPDF}=window.jspdf;
        const doc=new jsPDF();
        doc.setFontSize(20); doc.text("SEYAHAT KASA RAPORU", 14, 20);
        doc.setFontSize(10); doc.text("Olusturma Tarihi: " + new Date().toLocaleString('tr-TR'), 14, 28);
        doc.autoTable({startY:35, head:[['TUR','ACIKLAMA','TUTAR','TARIH']], body:records.map(r=>[r.type,r.name,r.price.toLocaleString()+' TL',r.date]), theme:'grid', headStyles:{fillColor:[79, 70, 229]}});
        doc.save("kasa-raporu.pdf");
    }

    function exportData(){
        const b=new Blob([JSON.stringify({records,settings})],{type:"application/json"});
        const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=kasa_yedek_.json;a.click();
    }

    function importData(e){
        const r=new FileReader();
        r.onload=x=>{
            try {
                const d=JSON.parse(x.target.result);
                records=d.records||[]; settings=d.settings||[];
                localStorage.setItem('records',JSON.stringify(records));
                localStorage.setItem('settings',JSON.stringify(settings));
                alert('Veriler başarıyla yüklendi!'); location.reload();
            } catch(h) { alert('Geçersiz dosya formatı!'); }
        };
        r.readAsText(e.target.files[0]);
    }

    function clearAllData(){if(confirm('TÜM KASA VERİLERİ SİLİNECEK! Emin misiniz?')){records=[];localStorage.setItem('records',"[]");renderTable();}}
    
    renderTable();
</script>
</body>
</html>
