<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyahat Kasa Takip v6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sayfa { display: none; }
        .sayfa.aktif { display: block; }
        .tab-btn.active { border-bottom: 4px solid white; opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

<div class="container mx-auto max-w-4xl p-4">
    <header class="bg-indigo-900 text-white rounded-t-2xl shadow-lg">
        <div class="p-6">
            <h1 class="text-2xl font-black uppercase">Seyahat Kasa Takip</h1>
            <p class="text-[10px] bg-yellow-400 text-black inline-block px-2 rounded font-bold">DENEME NO: 6</p>
        </div>
        
        <nav class="flex bg-indigo-800 text-xs font-bold uppercase tracking-wider">
            <button onclick="tabAc('kasa')" class="tab-btn flex-1 py-4 hover:bg-indigo-700 transition">Kasa Listesi</button>
            <button onclick="tabAc('ekle')" class="tab-btn flex-1 py-4 hover:bg-indigo-700 transition">Yeni İşlem</button>
            <button onclick="tabAc('ayarlar')" class="tab-btn flex-1 py-4 hover:bg-indigo-700 transition">Ayarlar</button>
            <button onclick="tabAc('veri')" class="tab-btn flex-1 py-4 hover:bg-indigo-700 transition">Veri Yönetimi</button>
        </nav>
    </header>

    <div id="kasa" class="sayfa aktif bg-white p-6 shadow-xl rounded-b-2xl">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-gray-500 uppercase text-sm">İşlem Kayıtları</h2>
            <div class="text-right">
                <span class="text-xs text-gray-400 block uppercase font-bold">Toplam Durum</span>
                <span id="genel-toplam" class="text-xl font-black text-indigo-600">0.00 ₺</span>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-[10px] uppercase text-gray-400">
                    <tr><th class="p-3">Tür</th><th class="p-3">Kalem</th><th class="p-3 text-right">Tutar</th><th class="p-3 text-center">Sil</th></tr>
                </thead>
                <tbody id="liste-govde"></tbody>
            </table>
        </div>
    </div>

    <div id="ekle" class="sayfa bg-white p-10 shadow-xl rounded-b-2xl">
        <div class="max-w-sm mx-auto space-y-4">
            <h2 class="font-black text-center text-indigo-900 uppercase">İşlem Ekle</h2>
            <select id="tur" class="w-full border-2 p-3 rounded-xl font-bold bg-gray-50">
                <option value="Gelir">GELİR (+)</option>
                <option value="Gider">GİDER (-)</option>
            </select>
            <input type="text" id="kalem" placeholder="Kalem Adı (Örn: Mazot)" class="w-full border-2 p-3 rounded-xl">
            <input type="number" id="tutar" placeholder="Tutar (₺)" class="w-full border-2 p-3 rounded-xl font-black text-lg">
            <button onclick="kaydet()" class="w-full bg-green-500 text-white p-4 rounded-xl font-black shadow-lg hover:bg-green-600">KAYDET</button>
        </div>
    </div>

    <div id="ayarlar" class="sayfa bg-white p-10 shadow-xl rounded-b-2xl">
        <p class="text-center text-gray-400 font-bold uppercase italic text-xs">Bu bölüm deneme 6'da sadeleştirilmiştir.</p>
    </div>

    <div id="veri" class="sayfa bg-white p-10 shadow-xl rounded-b-2xl text-center">
        <button onclick="sifirla()" class="bg-red-100 text-red-600 px-8 py-4 rounded-2xl font-bold border border-red-200">KASAYI SIFIRLA</button>
    </div>
</div>

<script>
    let islemler = JSON.parse(localStorage.getItem('kasa_v6')) || [];

    // SEKMEYİ AÇAN FONKSİYON (EN ÖNEMLİSİ)
    function tabAc(id) {
        console.log("Açılan tab: " + id);
        // Tüm sayfaları gizle
        document.querySelectorAll('.sayfa').forEach(s => s.classList.remove('aktif'));
        // Seçilen sayfayı göster
        document.getElementById(id).classList.add('aktif');
        
        if(id === 'kasa') listele();
    }

    function listele() {
        const govde = document.getElementById('liste-govde');
        govde.innerHTML = '';
        let toplam = 0;

        islemler.forEach((islem, index) => {
            if(islem.tur === 'Gelir') toplam += islem.tutar; else toplam -= islem.tutar;
            govde.innerHTML += 
                <tr class="border-b">
                    <td class="p-3 font-bold  uppercase text-[10px]"></td>
                    <td class="p-3 font-medium"></td>
                    <td class="p-3 text-right font-black"> ₺</td>
                    <td class="p-3 text-center"><button onclick="sil()">❌</button></td>
                </tr>;
        });
        document.getElementById('genel-toplam').textContent = toplam.toLocaleString() + ' ₺';
    }

    function kaydet() {
        const t = document.getElementById('tur').value;
        const k = document.getElementById('kalem').value;
        const tut = parseFloat(document.getElementById('tutar').value);

        if(!k || !tut) return alert("Lütfen boş alan bırakmayın!");

        islemler.push({ tur: t, kalem: k, tutar: tut });
        localStorage.setItem('kasa_v6', JSON.stringify(islemler));
        
        // Formu temizle ve kasaya dön
        document.getElementById('kalem').value = '';
        document.getElementById('tutar').value = '';
        tabAc('kasa');
    }

    function sil(index) {
        if(confirm("Silinsin mi?")) {
            islemler.splice(index, 1);
            localStorage.setItem('kasa_v6', JSON.stringify(islemler));
            listele();
        }
    }

    function sifirla() {
        if(confirm("Tüm kasa silinecek! Emin misiniz?")) {
            islemler = [];
            localStorage.removeItem('kasa_v6');
            tabAc('kasa');
        }
    }

    // İlk açılışta listeyi göster
    listele();
</script>
</body>
</html>
