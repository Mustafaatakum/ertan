<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ertan Hoca - Kasa Sistemi v8</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
    <div class="container mx-auto max-w-4xl p-4">
        <header class="bg-indigo-900 text-white p-8 rounded-t-3xl shadow-xl">
            <h1 class="text-2xl font-black uppercase">Seyahat Kasa Takip</h1>
            <div id="toplam-alan" class="mt-4 text-3xl font-bold text-green-400">0.00 ₺</div>
        </header>

        <nav class="bg-indigo-800 flex text-white font-bold text-xs">
            <button onclick="sayfaAc('liste')" class="flex-1 py-4 hover:bg-indigo-700 uppercase">Liste</button>
            <button onclick="sayfaAc('ekle')" class="flex-1 py-4 hover:bg-indigo-700 uppercase">İşlem Ekle</button>
            <button onclick="sayfaAc('ayarlar')" class="flex-1 py-4 hover:bg-indigo-700 uppercase">Yönetim</button>
        </nav>

        <main class="bg-white p-6 shadow-2xl rounded-b-3xl min-h-[400px]">
            <div id="sayfa-liste" class="sayfa-icerik">
                <table class="w-full text-left">
                    <thead class="border-b text-[10px] text-gray-400 uppercase font-black">
                        <tr><th class="p-3">Tür</th><th class="p-3">Kalem</th><th class="p-3 text-right">Tutar</th><th class="p-3 text-center">Sil</th></tr>
                    </thead>
                    <tbody id="kasa-tbody"></tbody>
                </table>
            </div>

            <div id="sayfa-ekle" class="sayfa-icerik hidden">
                <div class="max-w-md mx-auto space-y-4 pt-10">
                    <select id="input-tur" class="w-full border-2 p-4 rounded-2xl font-bold bg-slate-50"><option value="Gelir">GELİR (+)</option><option value="Gider">GİDER (-)</option></select>
                    <input type="text" id="input-ad" placeholder="İşlem Tanımı" class="w-full border-2 p-4 rounded-2xl">
                    <input type="number" id="input-tutar" placeholder="Tutar ₺" class="w-full border-2 p-4 rounded-2xl font-black text-xl">
                    <button onclick="kayitYap()" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-black shadow-lg">KAYDET</button>
                </div>
            </div>

            <div id="sayfa-ayarlar" class="sayfa-icerik hidden text-center pt-20">
                <button onclick="kasaSifirla()" class="bg-red-50 text-red-600 px-10 py-5 rounded-2xl font-black border border-red-200">TÜM VERİLERİ SİL</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
