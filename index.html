<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyahat Kasa Takip Deneme No:3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style> .tab-content { display: none; } .tab-content.active { display: block; } </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
<div class="container mx-auto p-4 max-w-5xl">
    <header class="bg-indigo-900 text-white p-6 rounded-t-2xl shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white uppercase">Seyahat Kasa Takip Deneme No:3</h1>
                <p class="text-xs opacity-70 font-bold uppercase">Mustafa Şahin IT Systems</p>
            </div>
            <div class="text-right text-sm font-medium bg-white/20 px-3 py-1 rounded-full" id="current-date"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white/10 p-4 rounded-xl border border-white/10 backdrop-blur-md">
                <p class="text-[10px] uppercase font-bold opacity-60 mb-1 text-white">Toplam Gelir</p>
                <p id="stat-gelir" class="text-2xl font-black text-green-400">0.00 ₺</p>
            </div>
            <div class="bg-white/10 p-4 rounded-xl border border-white/10 backdrop-blur-md">
                <p class="text-[10px] uppercase font-bold opacity-60 mb-1 text-white">Toplam Gider</p>
                <p id="stat-gider" class="text-2xl font-black text-red-400">0.00 ₺</p>
            </div>
            <div id="stat-kar-box" class="bg-white/20 p-4 rounded-xl border border-white/20 backdrop-blur-md">
                <p class="text-[10px] uppercase font-bold opacity-60 mb-1 text-white">Net Kar/Zarar</p>
                <p id="stat-kar" class="text-2xl font-black text-white">0.00 ₺</p>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b flex shadow-sm sticky top-0 z-50">
        <button onclick="showTab('kasa')" class="flex-1 py-4 text-sm font-bold border-b-4 border-transparent hover:bg-gray-50 focus:border-indigo-600 uppercase transition-all">Kasa</button>
        <button onclick="showTab('ekle')" class="flex-1 py-4 text-sm font-bold border-b-4 border-transparent hover:bg-gray-50 focus:border-indigo-600 uppercase transition-all">İşlem Ekle</button>
        <button onclick="showTab('ayarlar')" class="flex-1 py-4 text-sm font-bold border-b-4 border-transparent hover:bg-gray-50 focus:border-indigo-600 uppercase transition-all">Ayarlar</button>
        <button onclick="showTab('veri')" class="flex-1 py-4 text-sm font-bold border-b-4 border-transparent hover:bg-gray-50 focus:border-indigo-600 uppercase transition-all">Yedek</button>
    </nav>

    <div id="kasa" class="tab-content active bg-white p-6 shadow-xl rounded-b-2xl">
        <div class="flex flex-wrap gap-3 mb-6 bg-gray-50 p-4 rounded-xl border items-end">
            <div class="flex-1 min-w-[140px]">
                <label class="text-[10px] font-bold text-gray-400 uppercase">Başlangıç</label>
                <input type="date" id="filter-start" class="w-full border p-2 rounded-lg text-sm outline-none">
            </div>
            <div class="flex-1 min-w-[140px]">
                <label class="text-[10px] font-bold text-gray-400 uppercase">Bitiş</label>
                <input type="date" id="filter-end" class="w-full border p-2 rounded-lg text-sm outline-none">
            </div>
            <div class="flex gap-2">
                <button onclick="filterTable()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold text-sm">Filtrele</button>
                <button onclick="downloadPDF()" class="bg-red-500 text-white px-6 py-2 rounded-lg font-bold text-sm">PDF</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-[11px] text-gray-500 uppercase tracking-wider">
                        <th class="p-4 border-b">Tür</th><th class="p-4 border-b">Kalem</th><th class="p-4 border-b text-right">Tutar</th><th class="p-4 border-b text-center">Tarih</th><th class="p-4 border-b text-center">Sil</th>
                    </tr>
                </thead>
                <tbody id="kasa-tbody" class="text-sm"></tbody>
            </table>
        </div>
    </div>

    <div id="ekle" class="tab-content bg-white p-8 shadow-xl rounded-b-2xl">
        <div class="max-w-md mx-auto space-y-4">
            <div class="flex p-1 bg-gray-100 rounded-xl border">
                <label class="flex-1 text-center py-2 rounded-lg cursor-pointer font-bold text-sm transition-all has-[:checked]:bg-green-500 has-[:checked]:text-white"><input type="radio" name="type" value="Gelir" class="hidden" checked onclick="updateSelectionList()"> GELİR (+)</label>
                <label class="flex-1 text-center py-2 rounded-lg cursor-pointer font-bold text-sm transition-all has-[:checked]:bg-red-500 has-[:checked]:text-white"><input type="radio" name="type" value="Gider" class="hidden" onclick="updateSelectionList()"> GİDER (-)</label>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-gray-400 mb-1 uppercase">Kalem Seçimi</label>
                <select id="item-select" onchange="handleItemSelect()" class="w-full border-2 border-gray-100 p-3 rounded-xl font-bold text-gray-700 outline-none focus:border-indigo-500"></select>
                <input type="text" id="manual-name" placeholder="Kalem İsmi..." class="w-full mt-2 border-2 border-gray-100 p-3 rounded-xl hidden">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[11px] font-bold text-gray-400 mb-1 uppercase">Tutar</label><input type="number" id="form-price" class="w-full border-2 border-gray-100 p-3 rounded-xl font-black outline-none" step="0.01"></div>
                <div><label class="block text-[11px] font-bold text-gray-400 mb-1 uppercase">Tarih</label><input type="date" id="form-date" class="w-full border-2 border-gray-100 p-3 rounded-xl text-sm font-bold outline-none"></div>
            </div>
            <div><label class="block text-[11px] font-bold text-gray-400 mb-1 uppercase">Açıklama</label><textarea id="form-desc" class="w-full border-2 border-gray-100 p-3 rounded-xl text-sm outline-none" rows="2"></textarea></div>
            <button onclick="saveRecord()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black text-lg hover:bg-indigo-700 transition-all uppercase">Kaydet</button>
        </div>
    </div>

    <div id="ayarlar" class="tab-content bg-white p-6 shadow-xl rounded-b-2xl">
        <div class="grid md:grid-cols-2 gap-8 text-xs font-bold">
            <div class="bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-100 space-y-3">
                <h3 class="text-indigo-900 uppercase">Sistem Kalemi Ekle</h3>
                <input type="text" id="set-name" placeholder="Kalem Adı" class="w-full p-3 rounded-xl border border-indigo-200">
                <select id="set-type" class="w-full p-3 rounded-xl border border-indigo-200"><option value="Gelir">Gelir</option><option value="Gider">Gider</option></select>
                <label class="flex items-center gap-2 bg-white p-2 rounded-lg border border-indigo-100"><input type="checkbox" id="set-fixed" class="w-5 h-5"> Fiyat Sabit mi?</label>
                <input type="number" id="set-price" placeholder="Fiyat (₺)" class="w-full p-3 rounded-xl border border-indigo-200">
                <button onclick="addSettingItem()" class="w-full bg-indigo-900 text-white p-3 rounded-xl uppercase">Ekle</button>
            </div>
            <div id="settings-list" class="space-y-2"></div>
        </div>
    </div>

    <div id="veri" class="tab-content bg-white p-10 shadow-xl rounded-b-2xl text-center">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-2xl mx-auto font-black text-[10px] uppercase">
            <button onclick="exportData()" class="p-6 rounded-xl bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-600 hover:text-white transition-all">Yedek Al</button>
            <label class="p-6 rounded-xl bg-green-50 text-green-700 border border-green-200 cursor-pointer hover:bg-green-600 hover:text-white transition-all">Yükle<input type="file" class="hidden" onchange="importData(event)"></label>
            <button onclick="clearAllData()" class="p-6 rounded-xl bg-red-50 text-red-700 border border-red-200 hover:bg-red-600 hover:text-white transition-all">Sıfırla</button>
        </div>
        <p class="mt-8 text-gray-300 text-[10px] font-bold uppercase italic">Mustafa Şahin IT Teacher - Samsun Atakum MESEM 2026</p>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('records')) || [];
    let settings = JSON.parse(localStorage.getItem('settings')) || [{name:"Yolcu Ücreti",type:"Gelir",fixed:true,price:1000},{name:"Şoför Ücreti",type:"Gider",fixed:false,price:0},{name:"Yemek Ücreti",type:"Gider",fixed:false,price:0},{name:"Yakıt Ücreti",type:"Gider",fixed:false,price:0}];
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('tr-TR');
    function showTab(id){document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='ekle')updateSelectionList();if(id==='kasa')renderTable();if(id==='ayarlar')renderSettings();}
    function renderSettings(){const c=document.getElementById('settings-list');c.innerHTML='';settings.forEach((s,i)=>{c.innerHTML+=<div class="flex justify-between p-3 bg-white rounded border-l-4 shadow-sm "><span> ()</span><button onclick="deleteSetting()" class="text-red-400">Sil</button></div>;});localStorage.setItem('settings',JSON.stringify(settings));}
    function addSettingItem(){const n=document.getElementById('set-name').value;if(!n)return;settings.push({name:n,type:document.getElementById('set-type').value,fixed:document.getElementById('set-fixed').checked,price:parseFloat(document.getElementById('set-price').value)||0});renderSettings();document.getElementById('set-name').value='';}
    function deleteSetting(i){settings.splice(i,1);renderSettings();}
    function updateSelectionList(){const t=document.querySelector('input[name="type"]:checked').value;const s=document.getElementById('item-select');s.innerHTML='';settings.filter(x=>x.type===t).forEach(x=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name;if(x.name==="Yolcu Ücreti")o.selected=true;s.appendChild(o);});const o=document.createElement('option');o.value="CUSTOM";o.textContent="🔍 Diğer";s.appendChild(o);handleItemSelect();document.getElementById('form-date').valueAsDate=new Date();}
    function handleItemSelect(){const v=document.getElementById('item-select').value;const p=document.getElementById('form-price');const m=document.getElementById('manual-name');const s=settings.find(x=>x.name===v);if(s){p.value=s.fixed?s.price:0;m.value=s.name;m.classList.add('hidden');}else{p.value=0;m.value="";m.classList.remove('hidden');}}
    function saveRecord(){const r={id:Date.now(),type:document.querySelector('input[name="type"]:checked').value,name:document.getElementById('manual-name').value,price:parseFloat(document.getElementById('form-price').value)||0,date:document.getElementById('form-date').value,desc:document.getElementById('form-desc').value};if(!r.name||!r.date)return;records.push(r);localStorage.setItem('records',JSON.stringify(records));showTab('kasa');}
    function renderTable(d=records){const b=document.getElementById('kasa-tbody');b.innerHTML='';let gel=0,gid=0;d.sort((a,x)=>new Date(x.date)-new Date(a.date)).forEach(r=>{if(r.type==='Gelir')gel+=r.price;else gid+=r.price;b.innerHTML+=<tr class="border-b font-medium"><td class=" font-black text-[10px] p-4 uppercase"></td><td class="p-4"><div class="font-bold"></div><div class="text-[10px] text-gray-400 italic"></div></td><td class="p-4 text-right font-black text-indigo-900"> ₺</td><td class="p-4 text-center text-xs text-gray-500"></td><td class="p-4 text-center"><button onclick="delRec()">❌</button></td></tr>;});updateStats(gel,gid);}
    function updateStats(ge,gi){document.getElementById('stat-gelir').textContent=ge.toLocaleString()+' ₺';document.getElementById('stat-gider').textContent=gi.toLocaleString()+' ₺';const n=ge-gi;document.getElementById('stat-kar').textContent=n.toLocaleString()+' ₺';document.getElementById('stat-kar-box').className=n>=0?"bg-green-600/20 p-4 rounded-xl border border-green-500/30 transition-all":"bg-red-600/20 p-4 rounded-xl border border-red-500/30 transition-all";}
    function filterTable(){const s=document.getElementById('filter-start').value,e=document.getElementById('filter-end').value;if(s&&e)renderTable(records.filter(r=>r.date>=s&&r.date<=e));}
    function delRec(i){if(confirm('Sil?')){records=records.filter(x=>x.id!==i);localStorage.setItem('records',JSON.stringify(records));renderTable();}}
    function downloadPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.text("KASA RAPORU - DENEME 3",14,15);doc.autoTable({startY:20,head:[['TUR','KALEM','TUTAR','TARIH']],body:records.map(r=>[r.type,r.name,r.price+' TL',r.date])});doc.save("rapor.pdf");}
    function exportData(){const b=new Blob([JSON.stringify({records,settings})],{type:"application/json"});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download="yedek.json";a.click();}
    function importData(e){const r=new FileReader();r.onload=x=>{const d=JSON.parse(x.target.result);records=d.records;settings=d.settings;localStorage.setItem('records',JSON.stringify(records));localStorage.setItem('settings',JSON.stringify(settings));location.reload();};r.readAsText(e.target.files[0]);}
    function clearAllData(){if(confirm('Sıfırla?')){records=[];localStorage.setItem('records',"[]");renderTable();}}
    renderTable();
</script>
</body>
</html>
