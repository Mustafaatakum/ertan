<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ertan Hoca - Seyahat Kasa Sistemi v9</title>
    <style>
        :root { --primary: #1e3a8a; --secondary: #4338ca; --accent: #facc15; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #1e293b; }
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        header { background: var(--primary); color: white; padding: 25px 20px; text-align: center; position: relative; }
        .balance-label { font-size: 14px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { font-size: 32px; font-weight: 800; margin-top: 5px; }
        nav { display: flex; background: var(--secondary); padding: 5px; }
        nav button { flex: 1; padding: 12px; border: none; background: none; color: white; font-weight: 600; cursor: pointer; border-radius: 12px; transition: 0.3s; font-size: 13px; }
        nav button.active { background: white; color: var(--secondary); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .content { padding: 20px; min-height: 300px; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .list-info { display: flex; flex-direction: column; }
        .list-title { font-weight: 600; font-size: 15px; }
        .list-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
        .list-val { font-weight: 700; font-size: 15px; }
        .val-gelir { color: #10b981; } .val-gider { color: #ef4444; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #475569; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--secondary); }
        .btn-save { width: 100%; background: #10b981; color: white; padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-del { background: #fee2e2; color: #ef4444; border: none; padding: 8px; border-radius: 8px; cursor: pointer; margin-left: 10px; }
        .empty-state { text-align: center; color: #94a3b8; margin-top: 50px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="balance-label">MEVCUT KASA</div>
        <div id="total-balance" class="balance-amount">0.00 ₺</div>
        <div style="font-size: 10px; opacity: 0.5; margin-top: 10px;">SİSTEM VERSİYON: 9.0</div>
    </header>

    <nav>
        <button id="nav-list" class="active" onclick="showTab('list')">LİSTE</button>
        <button id="nav-add" onclick="showTab('add')">YENİ EKLE</button>
        <button id="nav-settings" onclick="showTab('settings')">YÖNETİM</button>
    </nav>

    <div class="content">
        <div id="tab-list" class="page active">
            <div id="items-container"></div>
        </div>

        <div id="tab-add" class="page">
            <div class="form-group">
                <label>İŞLEM TÜRÜ</label>
                <select id="f-type">
                    <option value="gelir">GELİR (+)</option>
                    <option value="gider">GİDER (-)</option>
                </select>
            </div>
            <div class="form-group">
                <label>KALEM / AÇIKLAMA</label>
                <input type="text" id="f-desc" placeholder="Örn: Tur Ödemesi">
            </div>
            <div class="form-group">
                <label>TUTAR (₺)</label>
                <input type="number" id="f-amount" step="0.01" placeholder="0.00">
            </div>
            <button class="btn-save" onclick="handleSave()">KAYDEDİLSİN</button>
        </div>

        <div id="tab-settings" class="page" style="text-align: center;">
            <h4 style="margin-bottom: 5px;">Veri Yönetimi</h4>
            <p style="font-size: 12px; color: #64748b;">Tüm veriler tarayıcınızın yerel hafızasında (LocalStorage) güvenle saklanır.</p>
            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 20px 0;">
            <button onclick="clearAllData()" style="background: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: 600;">Tüm Verileri Sıfırla</button>
        </div>
    </div>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('seyahat_kasa_v9')) || [];

    function showTab(tab) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('nav-' + tab).classList.add('active');
        if(tab === 'list') renderList();
    }

    function renderList() {
        const container = document.getElementById('items-container');
        const balanceEl = document.getElementById('total-balance');
        container.innerHTML = '';
        let total = 0;

        if(transactions.length === 0) {
            container.innerHTML = '<div class="empty-state">Henüz işlem kaydı bulunmuyor.</div>';
        } else {
            transactions.forEach((item, index) => {
                const amount = parseFloat(item.amount);
                const isGelir = item.type === 'gelir';
                total += isGelir ? amount : -amount;

                container.innerHTML += 
                    <div class="list-item">
                        <div class="list-info">
                            <span class="list-title">\</span>
                            <span class="list-sub">\</span>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="list-val \">
                                \\ ₺
                            </span>
                            <button class="btn-del" onclick="deleteItem(\)">✕</button>
                        </div>
                    </div>;
            });
        }

        balanceEl.innerText = total.toFixed(2) + ' ₺';
        balanceEl.style.color = total >= 0 ? 'white' : '#fca5a5';
    }

    function handleSave() {
        const desc = document.getElementById('f-desc').value;
        const amount = document.getElementById('f-amount').value;
        const type = document.getElementById('f-type').value;

        if(!desc || !amount) return alert("Lütfen tüm alanları doldurun!");

        transactions.push({ desc, amount, type });
        localStorage.setItem('seyahat_kasa_v9', JSON.stringify(transactions));
        
        document.getElementById('f-desc').value = '';
        document.getElementById('f-amount').value = '';
        showTab('list');
    }

    function deleteItem(index) {
        if(confirm('Bu işlemi silmek istediğinize emin misiniz?')) {
            transactions.splice(index, 1);
            localStorage.setItem('seyahat_kasa_v9', JSON.stringify(transactions));
            renderList();
        }
    }

    function clearAllData() {
        if(confirm('DİKKAT: Tüm kasa verileri kalıcı olarak silinecek! Onaylıyor musunuz?')) {
            transactions = [];
            localStorage.removeItem('seyahat_kasa_v9');
            renderList();
            showTab('list');
        }
    }

    // Uygulamayı başlat
    renderList();
</script>

</body>
</html>
