<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyahat Kasa Takip v7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sekme-icerik { display: none; }
        .sekme-icerik.aktif { display: block !important; }
        .nav-btn.active { background-color: #3730a3; border-bottom: 4px solid #facc15; }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-900">

<div class="container mx-auto max-w-4xl p-4">
    <header class="bg-indigo-900 text-white rounded-t-3xl shadow-2xl p-8 mb-0">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black tracking-tighter uppercase">Seyahat Kasa</h1>
                <span class="bg-yellow-400 text-indigo-900 text-[10px] font-bold px-2 py-0.5 rounded">DENEME NO: 7</span>
            </div>
            <div class="text-right">
                <p class="text-[10px] uppercase opacity-60">Toplam Durum</p>
                <p id="ana-toplam" class="text-2xl font-black text-green-400">0.00 ₺</p>
            </div>
        </div>
    </header>

    <nav class="bg-indigo-800 flex shadow-inner">
        <button onclick="sekmeDegistir('kasa-listesi', this)" class="nav-btn active flex-1 py-4 text-xs font-black text-white uppercase tracking-widest transition-all">Kasa Listesi</button>
        <button onclick="sekmeDegistir('yeni-islem', this)" class="nav-btn flex-1 py-4 text-xs font-black text-white uppercase tracking-widest transition-all">Yeni İşlem</button>
        <button onclick="sekmeDegistir('ayarlar-sekmesi', this)" class="nav-btn flex-1 py-4 text-xs font-black text-white uppercase tracking-widest transition-all">Ayarlar</button>
    </nav>

    <div id="kasa-listesi" class="sekme-icerik aktif bg-white p-6 shadow-xl rounded-b-3xl border-x border-b border-slate-200">
        <h2 class="text-slate-400 text-[11px] font-black uppercase mb-4 tracking-widest text-center border-b pb-2">Kayıtlı İşlemler</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="text-[10px] text-slate-400 uppercase">
                    <tr><th class="p-3">Tür</th><th class="p-3">Kalem</th><th class="p-3 text-right">Tutar</th><th class="p-3 text-center">İşlem</th></tr>
                </thead>
                <tbody id="tablo-govdesi"></tbody>
            </table>
        </div>
    </div>

    <div id="yeni-islem" class="sekme-icerik bg-white p-10 shadow-xl rounded-b-3xl border-x border-b border-slate-200">
        <div class="max-w-sm mx-auto space-y-5">
            <h2 class="text-xl font-black text-center text-indigo-900 uppercase">Hızlı İşlem Ekle</h2>
            
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">İşlem Tipi</label>
                <select id="islem-tur" class="w-full border-2 border-slate-100 bg-slate-50 p-4 rounded-2xl font-bold focus:border-indigo-500 outline-none">
                    <option value="Gelir">GELİR (+)</option>
                    <option value="Gider">GİDER (-)</option>
                </select>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">İşlem Kalemi</label>
                <input type="text" id="islem-ad" placeholder="Örn: Yolcu Ücreti, Mazot..." class="w-full border-2 border-slate-100 bg-slate-50 p-4 rounded-2xl font-bold focus:border-indigo-500 outline-none">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Tutar (₺)</label>
                <input type="number" id="islem-tutar" placeholder="0.00" class="w-full border-2 border-slate-100 bg-slate-50 p-4 rounded-2xl font-black text-xl focus:border-indigo-500 outline-none">
            </div>

            <button onclick="veriyiKaydet()" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-black text-lg hover:bg-indigo-700 active:scale-95 transition-all shadow-xl">KASAYA EKLE</button>
        </div>
    </div>

    <div id="ayarlar-sekmesi" class="sekme-icerik bg-white p-10 shadow-xl rounded-b-3xl border-x border-b border-slate-200 text-center">
        <h2 class="text-xl font-black text-indigo-900 uppercase mb-6">Veri Yönetimi</h2>
        <div class="flex flex-col gap-4 max-w-xs mx-auto">
            <button onclick="kasaSifirla()" class="bg-rose-50 text-rose-600 p-4 rounded-2xl font-bold border border-rose-100 hover:bg-rose-600 hover:text-white transition-all">TÜM KASAYI SIFIRLA</button>
            <p class="text-[10px] text-slate-300 font-bold uppercase mt-10">Mustafa Şahin • IT Teacher • v7.0</p>
        </div>
    </div>
</div>

<script>
    // VERİLERİ ÇEK
    let kasaVerisi = JSON.parse(localStorage.getItem('kasa_v7')) || [];

    // SEKME DEĞİŞTİRME (GARANTİ YÖNTEM)
    function sekmeDegistir(sekmeId, btn) {
        console.log("Sekme açılıyor: " + sekmeId);
        
        // 1. Tüm içerikleri gizle
        document.querySelectorAll('.sekme-icerik').forEach(div => {
            div.classList.remove('aktif');
        });
        
        // 2. Tüm butonların aktifliğini kaldır
        document.querySelectorAll('.nav-btn').forEach(b => {
            b.classList.remove('active');
        });

        // 3. İlgili içeriği göster ve butonu işaretle
        document.getElementById(sekmeId).classList.add('aktif');
        btn.classList.add('active');

        if(sekmeId === 'kasa-listesi') tabloyuGuncelle();
    }

    // TABLOYU DOLDUR
    function tabloyuGuncelle() {
        const tbody = document.getElementById('tablo-govdesi');
        tbody.innerHTML = '';
        let toplam = 0;

        kasaVerisi.forEach((islem, index) => {
            const miktar = parseFloat(islem.tutar);
            if(islem.tur === 'Gelir') toplam += miktar; else toplam -= miktar;

            tbody.innerHTML += 
                <tr class="border-b hover:bg-slate-50 transition-colors">
                    <td class="p-4"><span class="px-2 py-1 rounded text-[9px] font-black uppercase "></span></td>
                    <td class="p-4 font-bold text-slate-700"></td>
                    <td class="p-4 text-right font-black "> ₺</td>
                    <td class="p-4 text-center"><button onclick="islemSil()" class="text-slate-300 hover:text-rose-500 transition-colors">❌</button></td>
                </tr>;
        });

        const toplamEl = document.getElementById('ana-toplam');
        toplamEl.textContent = toplam.toLocaleString('tr-TR', {minimumFractionDigits: 2}) + ' ₺';
        toplamEl.className = toplam >= 0 ? "text-2xl font-black text-green-500" : "text-2xl font-black text-rose-500";
    }

    // KAYIT EKLE
    function veriyiKaydet() {
        const tur = document.getElementById('islem-tur').value;
        const ad = document.getElementById('islem-ad').value;
        const tutar = parseFloat(document.getElementById('islem-tutar').value);

        if(!ad || isNaN(tutar)) {
            alert("Lütfen geçerli bir isim ve tutar girin!");
            return;
        }

        kasaVerisi.push({ tur, ad, tutar });
        localStorage.setItem('kasa_v7', JSON.stringify(kasaVerisi));
        
        // Temizle ve Listeye Dön
        document.getElementById('islem-ad').value = '';
        document.getElementById('islem-tutar').value = '';
        
        // Butonu manuel bulup tetikleyelim
        const listBtn = document.querySelectorAll('.nav-btn')[0];
        sekmeDegistir('kasa-listesi', listBtn);
    }

    // SİL
    function islemSil(index) {
        if(confirm("Bu kaydı silmek istediğinize emin misiniz?")) {
            kasaVerisi.splice(index, 1);
            localStorage.setItem('kasa_v7', JSON.stringify(kasaVerisi));
            tabloyuGuncelle();
        }
    }

    // SIFIRLA
    function kasaSifirla() {
        if(confirm("DİKKAT: Tüm kayıtlar kalıcı olarak silinecek!")) {
            kasaVerisi = [];
            localStorage.removeItem('kasa_v7');
            location.reload();
        }
    }

    // Başlangıçta tabloyu yükle
    tabloyuGuncelle();
</script>
</body>
</html>
